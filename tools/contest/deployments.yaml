include:
  - ../deployctl/deployments.yaml

deployments:
  app-unit:
    uploads:
      - &go-unit
        label: Go systemd unit
        role: app
        local: 'etc/systemd/system/{var:service}.service'
        remote: '/etc/systemd/system/{var:service}.service'
        validate: 'sudo systemd-analyze verify /etc/systemd/system/{var:service}.service'
      - &database-env
        label: shared Go and official initialization DB connection
        role: app
        local: tools/contest/generated/database.env
        remote: '{var:remote_home}/database.env'
      - &matching-env
        label: private matching solver endpoint
        role: app
        local: tools/contest/generated/matching.env
        remote: '{var:remote_home}/matching.env'
    activations:
      - label: reload unit and start stopped application
        role: app
        script: |
          set -eu
          sudo systemctl daemon-reload
          sudo systemctl start {var:service}
          sudo systemctl is-active --quiet {var:service}

  app:
    uploads:
      - label: Go application
        role: app
        local: '{var:app_dir}/'
        remote: '{var:remote_home}/{var:app_dir}/'
        delete: true
        excludes: ['node_modules', '*.pprof', 'default.pgo', 'matching-worker']
      - *go-unit
      - *database-env
      - *matching-env
    activations:
      - label: restart Go with the remote primary and existing local WAL
        role: app
        script: |
          set -eu
          sudo chown -R {var:isucon_user}:{var:isucon_user} {var:remote_home}/{var:app_dir}
          sudo systemctl daemon-reload
          sudo systemctl restart {var:service}
          sudo systemctl is-active --quiet {var:service}

  nginx:
    uploads:
      - label: public static assets
        role: nginx
        local: webapp/public/
        remote: '{var:remote_home}/webapp/public/'
        delete: true
      - label: nginx configuration preserving the installed TLS certificates
        role: nginx
        local: 'tools/contest/generated/nginx/{host}/'
        remote: /etc/nginx/
        excludes: [tls/]
        delete: true
        validate: sudo nginx -t
      - label: kernel TCP connection distribution
        role: tls_forward
        local: tools/contest/generated/isuride-tls.nft
        remote: '{var:remote_home}/isuride-tls.nft'
        validate: 'sudo nft --check --file {var:remote_home}/isuride-tls.nft'
      - label: persistent IPv4 forwarding settings
        role: tls_forward
        local: tools/contest/generated/isuride-tls.sysctl
        remote: '{var:remote_home}/isuride-tls.sysctl'
      - label: kernel TCP entry unit
        role: tls_forward
        local: tools/contest/generated/isuride-tls-forward.service
        remote: /etc/systemd/system/isuride-tls-forward.service
        validate: sudo systemd-analyze verify /etc/systemd/system/isuride-tls-forward.service
    activations:
      - label: replace the TCP relay with kernel NAT and restart TLS endpoints
        role: nginx
        script: |
          set -eu
          sudo chown -R {var:isucon_user}:{var:isucon_user} {var:remote_home}/webapp/public
          # The old relay and its unit are removed, not retained as a fallback.
          if sudo systemctl cat isuride-tls-router >/dev/null 2>&1; then
            sudo systemctl disable --now isuride-tls-router
          fi
          sudo rm -f /etc/systemd/system/isuride-tls-router.service {var:remote_home}/tls-router
          sudo systemctl daemon-reload
          case ',{var:tls_forward_hosts},' in
            *',{host},'*)
              sudo systemctl enable isuride-tls-forward
              sudo systemctl restart isuride-tls-forward
              sudo systemctl is-active --quiet isuride-tls-forward
              ;;
          esac
          sudo systemctl enable nginx
          sudo systemctl restart nginx
          sudo systemctl is-active --quiet nginx
          # Requires=nginx can stop the matcher during an nginx restart.
          case ',{var:matcher_hosts},' in
            *',{host},'*)
              sudo systemctl start isuride-matcher
              sudo systemctl is-active --quiet isuride-matcher
              ;;
          esac

  mysql:
    uploads:
      - label: MySQL configuration
        role: mysql
        local: mysql/
        remote: /etc/mysql/
        excludes: [debian.cnf]
        delete: true
        validate: sudo mysqld --validate-config
      - label: MySQL systemd limits
        role: mysql
        local: etc/systemd/system/mysql.service.d/
        remote: /etc/systemd/system/mysql.service.d/
    activations:
      - label: restart the primary and grant the single application host access
        role: mysql
        script: |
          set -eu
          sudo systemctl daemon-reload
          sudo systemctl restart mysql
          sudo systemctl is-active --quiet mysql
          # Official credentials were checked against the application's env.sh.
          sudo mysql <<'SQL'
          CREATE USER IF NOT EXISTS 'isucon'@'{var:app_ip}' IDENTIFIED BY 'isucon';
          ALTER USER 'isucon'@'{var:app_ip}' IDENTIFIED BY 'isucon';
          GRANT ALL PRIVILEGES ON `{var:db_name}`.* TO 'isucon'@'{var:app_ip}';
          SQL

  db-schema:
    uploads:
      - label: official SQL schema and initialization data
        role: app_db
        local: '{var:sql_dir}/'
        remote: '{var:remote_home}/{var:sql_dir}/'
        delete: true
    activations:
      - label: recreate the official database with its original collation
        role: app_db
        script: |
          set -eu
          sudo chown -R {var:isucon_user}:{var:isucon_user} {var:remote_home}/{var:sql_dir}
          sudo mysql -e 'DROP DATABASE IF EXISTS `{var:db_name}`; CREATE DATABASE `{var:db_name}` DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;'
          sudo mysql '{var:db_name}' < '{var:remote_home}/{var:sql_dir}/{var:sql_schema_file}'

  sql-assets:
    uploads:
      - label: official initialization assets
        role: sql_assets
        local: '{var:sql_dir}/'
        remote: '{var:remote_home}/{var:sql_dir}/'
        delete: true
    activations:
      - label: set initialization asset ownership
        role: sql_assets
        script: |
          set -eu
          sudo chown -R {var:isucon_user}:{var:isucon_user} {var:remote_home}/{var:sql_dir}

  matching-worker:
    uploads:
      - label: stateless matching solver binary
        role: solver
        local: '{var:app_dir}/matching-worker'
        remote: '{var:remote_home}/matching-worker'
      - label: private solver listen and application peer
        role: solver
        local: tools/contest/generated/matching-worker.env
        remote: '{var:remote_home}/matching-worker.env'
      - label: matching solver unit
        role: solver
        local: etc/systemd/system/isuride-matching-worker.service
        remote: /etc/systemd/system/isuride-matching-worker.service
    activations:
      - label: restart the stateless solver on its private listener
        role: solver
        script: |
          set -eu
          sudo chown {var:isucon_user}:{var:isucon_user} {var:remote_home}/matching-worker
          sudo chmod 755 {var:remote_home}/matching-worker
          # Validate after all uploads, including the first executable, finish.
          sudo systemd-analyze verify /etc/systemd/system/isuride-matching-worker.service
          sudo systemctl daemon-reload
          sudo systemctl restart isuride-matching-worker
          sudo systemctl is-active --quiet isuride-matching-worker

  matcher:
    uploads:
      - label: matcher unit
        role: matcher
        local: etc/systemd/system/isuride-matcher.service
        remote: /etc/systemd/system/isuride-matcher.service
        validate: sudo systemd-analyze verify /etc/systemd/system/isuride-matcher.service
    activations:
      - label: restart the single matcher on the entry host
        role: matcher
        script: |
          set -eu
          sudo systemctl daemon-reload
          sudo systemctl restart isuride-matcher
          sudo systemctl is-active --quiet isuride-matcher

  payment-mock:
    uploads:
      - label: payment mock unit
        role: payment_mock
        local: etc/systemd/system/isuride-payment_mock.service
        remote: /etc/systemd/system/isuride-payment_mock.service
        validate: sudo systemd-analyze verify /etc/systemd/system/isuride-payment_mock.service
    activations:
      - label: restart the installed payment mock beside Go
        role: payment_mock
        script: |
          set -eu
          sudo systemctl daemon-reload
          sudo systemctl restart isuride-payment_mock
          sudo systemctl is-active --quiet isuride-payment_mock

  matcher-stop:
    activations:
      - label: stop matcher before recreating DB
        role: all
        script: |
          set -eu
          # Hosts outside the matcher role have no unit; systemctl exits 5 there.
          sudo systemctl stop isuride-matcher || test $? = 5
          test "$(sudo systemctl show isuride-matcher -p MainPID --value)" = 0

  app-initialize:
    activations:
      - label: initialize with the supplied payment mock
        role: app_init
        script: |
          set -eu
          # Go opens its listener after restoring the remote DB and local WAL.
          timeout 30 bash -c 'until (: </dev/tcp/127.0.0.1/{var:listen_port}) 2>/dev/null; do sleep 0.1; done'
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            -d '{"payment_server":"http://127.0.0.1:12345"}' \
            'http://127.0.0.1:{var:listen_port}{var:initialize_path}'

  dependency-roles-off:
    activations:
      - label: stop dependencies outside their assigned hosts
        role: all
        script: |
          set -eu
          case ',{var:solver_hosts},' in
            *',{host},'*) ;;
            *)
              if sudo systemctl cat isuride-matching-worker >/dev/null 2>&1; then
                sudo systemctl disable --now isuride-matching-worker
              fi
              ;;
          esac
          case ',{var:matcher_hosts},' in
            *',{host},'*) ;;
            *)
              if sudo systemctl cat isuride-matcher >/dev/null 2>&1; then
                sudo systemctl disable --now isuride-matcher
              fi
              ;;
          esac
          case ',{var:payment_mock_hosts},' in
            *',{host},'*) ;;
            *)
              if sudo systemctl cat isuride-payment_mock >/dev/null 2>&1; then
                sudo systemctl disable --now isuride-payment_mock
              fi
              ;;
          esac
          case ',{var:tls_forward_hosts},' in
            *',{host},'*) ;;
            *)
              if sudo systemctl cat isuride-tls-forward >/dev/null 2>&1; then
                sudo systemctl disable --now isuride-tls-forward
              fi
              ;;
          esac

  dependency-roles-on:
    activations:
      - label: enable the stateless matching solver
        role: solver
        script: |
          set -eu
          sudo systemctl daemon-reload
          sudo systemctl enable --now isuride-matching-worker
          sudo systemctl is-active --quiet isuride-matching-worker
      - label: enable the matcher on the entry host
        role: matcher
        script: |
          set -eu
          sudo systemctl enable --now isuride-matcher
          sudo systemctl is-active --quiet isuride-matcher
      - label: enable the payment mock on the application host
        role: payment_mock
        script: |
          set -eu
          sudo systemctl enable --now isuride-payment_mock
          sudo systemctl is-active --quiet isuride-payment_mock
      - label: restore kernel TCP distribution on the entry host
        role: tls_forward
        script: |
          set -eu
          sudo systemctl daemon-reload
          sudo systemctl enable --now isuride-tls-forward
          sudo systemctl is-active --quiet isuride-tls-forward

plans:
  deploy-all:
    deployments:
      sysctl: {}
      matcher-stop: {}
      app-stop: {needs: [matcher-stop]}
      mysql: {needs: [app-stop]}
      sql-assets: {needs: [app-stop]}
      payment-mock: {needs: [app-stop]}
      matching-worker: {needs: [app-stop]}
      app: {needs: [mysql, sql-assets, payment-mock, matching-worker]}
      nginx: {needs: [app]}
      matcher: {needs: [nginx]}
      dependency-roles-off: {needs: [matcher]}
      roles-off: {needs: [dependency-roles-off]}
      roles-on: {needs: [roles-off]}
      dependency-roles-on: {needs: [roles-on]}
  db-recreate:
    deployments:
      matcher-stop: {}
      app-stop: {needs: [matcher-stop]}
      mysql: {needs: [app-stop]}
      sql-assets: {needs: [app-stop]}
      payment-mock: {needs: [app-stop]}
      matching-worker: {needs: [app-stop]}
      db-schema: {needs: [mysql]}
      app-unit: {needs: [db-schema, sql-assets]}
      app-initialize: {needs: [app-unit, payment-mock, matching-worker]}
      nginx: {needs: [app-initialize]}
      matcher: {needs: [nginx]}
      dependency-roles-off: {needs: [matcher]}
      roles-off: {needs: [dependency-roles-off]}
      roles-on: {needs: [roles-off]}
      dependency-roles-on: {needs: [roles-on]}
  roles:
    deployments:
      dependency-roles-off: {}
      roles-off: {needs: [dependency-roles-off]}
      roles-on: {needs: [roles-off]}
      dependency-roles-on: {needs: [roles-on]}
