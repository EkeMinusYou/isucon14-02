# Contest-specific tasks for this competition's solution.
#
# Taskfile.yml includes this file with flatten:true, so these tasks are called
# without a namespace and read the generic file's vars. Task names must not
# collide with the generic file: Go Task rejects duplicates instead of
# overriding them. The generic side reaches this file only through hook tasks
# it declares (currently prepare-db-assets, gen-contest-routing,
# setup-contest-assets and setup-smoke-probes); a contest
# that has nothing to do defines the hook here with no commands.
version: '3'

tasks:
  test-matching:
    desc: 一時的なローカルMySQLコンテナで一括配車の正当性を確認（競技サーバーは使用しない）
    dir: '{{.APP_DIR}}'
    env:
      ISURIDE_TEST_MYSQL_IMAGE: '{{.MATCHING_TEST_MYSQL_IMAGE | default "mysql:8.0.46"}}'
    cmds:
      - go test -race -count=1 -v -run '^TestMatching$' .

  test-app:
    desc: Goアプリの通知・統計を検証（MYSQL_TEST_DSN指定時はローカルMySQLで統合テスト）
    dir: '{{.APP_DIR}}'
    cmds: [go test -race ./...]

  check-chair-distance:
    desc: ローカルの一時MySQLで距離集計・SSE通知・椅子統計の初期化とAPIを確認
    dir: '{{.APP_DIR}}'
    cmds:
      - |
        set -eu
        distance_container=$(docker run --rm -d -p 127.0.0.1::3306 -e MYSQL_ROOT_PASSWORD=distance-local-test -e MYSQL_DATABASE=isuride mysql:8.0.46)
        trap 'docker rm -f "$distance_container" >/dev/null' EXIT
        ready=0
        for attempt in $(seq 1 60); do
          if docker exec "$distance_container" mysqladmin --host=127.0.0.1 -uroot -pdistance-local-test ping --silent >/dev/null 2>&1; then ready=1; break; fi
          sleep 1
        done
        test "$ready" = 1
        distance_address=$(docker port "$distance_container" 3306/tcp)
        export ISUCON_DB_HOST=127.0.0.1 ISUCON_DB_PORT="${distance_address##*:}"
        export ISUCON_DB_USER=root ISUCON_DB_PASSWORD=distance-local-test ISUCON_DB_NAME=isuride
        export CHAIR_DISTANCE_TEST_DSN="root:distance-local-test@tcp(127.0.0.1:$ISUCON_DB_PORT)/isuride?parseTime=true&multiStatements=true"
        export MYSQL_TEST_DSN="$CHAIR_DISTANCE_TEST_DSN"
        ../sql/init.sh
        go test -race -count=1 -v .

  deploy-sql:
    desc: SQL初期化資材をAPP_HOSTSへ反映（DB再作成・サービス再起動なし）
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists; run task after-bench or task abort-run
    deps: [build-deployctl]
    cmds:
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply sql-assets -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  prepare-db-assets:
    desc: deployへ載せる前にDB資材を生成・検証する（deploy系のhook、既定は何もしない）

  gen-contest-routing:
    desc: 解法固有のupstreamとホスト別生成物を追加する（genのhook、既定は何もしない）

  setup-contest-assets:
    desc: 標準の取得対象外にある競技固有の資材を取得する（setupのhook、既定は何もしない）
    cmds:
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/etc/systemd/system/isuride-matcher.service etc/systemd/system/'
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/etc/systemd/system/isuride-payment_mock.service etc/systemd/system/'

  setup-smoke-probes:
    desc: smoke実行中に競技固有の経路を追加で確認する（setup-smokeのhook、既定は何もしない）
    cmds:
      - '{{.SSH}} {{.SSH_USER}}@{{.MYSQL_HOST}} "sudo mysql {{.DB_NAME}} -e \"SELECT SLEEP(0.06) AS setup_slow_log_probe\""'

  setup-smoke-analysis:
    desc: RUNを作らず疎通成果物をDuckDBとdashboardのAPI・parserで確認
    requires:
      vars: [SMOKE_DIR]
    env:
      ISUCON_SETUP_SMOKE_DIR: '{{.ROOT_DIR}}/{{.SMOKE_DIR}}'
    cmds:
      - cd tools/analysisctl && go test -count=1 -v -run '^TestISURIDE(SetupSmokeDuckDB|PortalResultMarkers)$' .
      - cd tools/analysisctl/internal/pprofimport && go test -count=1 -v -run '^TestISURIDESetupSmokePprofDuckDB$' .
      - cd tools/dashboard/server && go test -count=1 -v -run '^TestISURIDESetupSmokeAPI$' .
      - for profile in '{{.SMOKE_DIR}}'/*.pprof; do go tool pprof -top "$profile"; done

  setup-postflight:
    desc: 配布物・role・内部疎通とcollector終了を読み取りで確認
    deps: [build-deployctl, build-measurectl]
    cmds:
      - task: check-roles
      - task: check-network
      - '{{.DEPLOYCTL_DIR}}/deployctl verify -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'
      - '{{.MEASURECTL_DIR}}/measurectl collect check-clean {{.MEASURECTL_REMOTE}}'
      - '{{.SSH}} {{.SSH_USER}}@{{.ENTRY_HOST}} "curl -fsS http://127.0.0.1:6060/debug/profiles/status" </dev/null'
