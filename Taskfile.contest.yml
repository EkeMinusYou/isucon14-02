# Contest-specific tasks for this competition's solution.
#
# Taskfile.yml includes this file with flatten:true, so these tasks are called
# without a namespace and read the generic file's vars. Task names must not
# collide with the generic file: Go Task rejects duplicates instead of
# overriding them. The generic side reaches this file only through hook tasks
# it declares (currently build-contest-assets, prepare-db-assets, gen-contest-routing,
# setup-contest-assets, setup-smoke-probes and check-contest-network); a contest
# that has nothing to do defines the hook here with no commands.
version: '3'

tasks:
  build-contest-assets:
    desc: アプリbuildに付随する競技固有binaryをビルド
    cmds:
      - task: build-matching-worker

  build-matching-worker:
    desc: 状態を持たない配車solverをTARGET_OS/TARGET_ARCHへビルド
    dir: '{{.APP_DIR}}'
    cmds:
      - '{{.GO_BUILD_ENV}} go build -trimpath -ldflags "-s -w" -o matching-worker ./cmd/matching-worker'

  deploy-matching-worker-dry:
    desc: solverの配布先とservice操作を実行せず表示
    deps: [gen, build-deployctl, build-matching-worker]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply matching-worker -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-matching-worker:
    desc: solverをSOLVER_HOSTSへ配布・再起動
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists; run task after-bench or task abort-run
    deps: [gen, build-deployctl, build-matching-worker]
    cmds:
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply matching-worker -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  check-matching-worker-roles-dry:
    desc: 全ホストのsolverを含むrole確認を実行せず表示
    deps: [build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl check-roles -dry-run {{.DEPLOYCTL_COMMON}}'

  verify-deployment:
    desc: 全ホストの配布物が現在のworktreeと一致することを読み取り確認
    deps: [gen, build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl verify -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  check-matching-worker-network:
    desc: 状態を変えないsolver RPCでownerからの疎通と他ホストの拒否を確認
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: >-
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}}
          'set -eu;
          {{if eq .ITEM (splitList " " .APP_HOSTS | first)}}
          result=$(curl --fail-with-body --silent --show-error --max-time 3
          -H "Content-Type: application/json"
          -d "{\"r\":[{\"d\":1}],\"c\":[{\"s\":2}]}"
          http://{{index .IP (splitList " " .SOLVER_HOSTS | first)}}:{{.SOLVER_PORT}}/solve);
          test "$result" = "{\"c\":[0]}";
          echo "private solver RPC OK";
          {{else}}
          code=$(curl --silent --show-error --max-time 3 -o /dev/null -w "%{http_code}"
          -H "X-Forwarded-For: {{index .IP (splitList " " .APP_HOSTS | first)}}" -d "{}"
          http://{{index .IP (splitList " " .SOLVER_HOSTS | first)}}:{{.SOLVER_PORT}}/solve);
          test "$code" = 403;
          echo "non-owner solver access denied";
          {{end}}'

  test-matching-worker:
    desc: solverの割当一致・RPC異常・snapshot再検証・WAL復元をローカルで確認
    dir: '{{.APP_DIR}}'
    cmds:
      - go test -race -count=1 -run '^Test(Matching|LargeMatching)' ./...

  check-tls-routing:
    desc: ローカルDockerでTLS分散・両HTTP終端・SSE・内部API制限・ログ集計を確認
    deps: [gen]
    cmds:
      - python3 tools/contest/check-tls-routing.py

  deploy-nginx-dry:
    desc: 両TLS終端と2号機TCP入口の配布・service操作を実行せず表示
    deps: [gen, build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply nginx -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-matcher-dry:
    desc: matcherの配布先とservice操作を実行せず表示
    deps: [build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply matcher -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-matcher:
    desc: matcher unitをMATCHER_HOSTSへ配布・再起動
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists; run task after-bench or task abort-run
    deps: [build-deployctl]
    cmds:
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply matcher -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  build-ride-metrics:
    desc: 計測対象Goアプリとsql-pool collectorを既存buildタスクでクロスコンパイル
    deps: [build, build-sql-pool-metrics]

  test-ride-metrics-collector:
    desc: sql-pool collectorの独立した項目上限とexport契約を確認
    dir: '{{.MEASUREMENT_DIR}}'
    cmds: [go test -race -count=1 ./cmd/sql-pool-metrics]

  test-ride-metrics:
    deps: [test-ride-metrics-collector]
    desc: 座標・回転・配車・評価の境界とcollectorからDuckDBまでをローカルfixtureで確認
    dir: '{{.APP_DIR}}'
    cmds:
      - go test -race -count=1 -v -run '^Test(CoordinateMetrics|FlowMetrics|PlanningMetrics|RideMetricsSnapshot|DispatchMetrics|EvaluationMetrics|PaymentRetryCount|RideMetricsCollectorDuckDB)' .

  test-nearby-chairs:
    desc: SQLなしの近隣椅子APIの条件と最新状態を確認
    dir: '{{.APP_DIR}}'
    cmds:
      - go test -race -count=1 -v -run '^TestAppGetNearbyChairs$' .

  test-matching:
    desc: オンメモリ一括配車の順序・排他・通知条件を確認
    dir: '{{.APP_DIR}}'
    cmds:
      - go test -race -count=1 -v -run '^TestMatching' .

  test-app:
    desc: GoアプリのWAL・状態遷移・通知・統計を検証（MYSQL_TEST_DSN指定時はローカルMySQLで統合テスト）
    dir: '{{.APP_DIR}}'
    cmds: [go test -race ./...]

  test-coordinate-cells:
    desc: 椅子セル・stripe WALの排他・到着順序・履歴復元をローカルで確認
    dir: '{{.APP_DIR}}'
    cmds:
      - go test -race -count=1 -timeout=60s -v -run '^Test(CoordinatePath|CoordinateRecovery|CoordinateControl|CoordinateWAL|CoordinateConcurrent|CoordinatesAndTransitionsWithoutDB|ConcurrentCoordinatesRetainOrderedHistory|FailedWALDoesNotPublish|CoordinateMetrics|FlowMetrics|RideMetricsSnapshot)' .

  test-runtime-accounts-mysql:
    desc: 一時MySQLでSQL照合・招待・クーポン・ライド・売上のWAL復元をrace検査
    dir: '{{.APP_DIR}}'
    cmds:
      - |
        set -eu
        accounts_container=$(docker run -d --tmpfs /var/lib/mysql:rw,size=512m -p 127.0.0.1::3306 -e MYSQL_ROOT_PASSWORD=accounts-local-test -e MYSQL_DATABASE=isuride mysql:8.0.46)
        trap 'docker rm -f "$accounts_container" >/dev/null' EXIT
        ready=0
        for attempt in $(seq 1 30); do
          if docker exec "$accounts_container" mysqladmin --host=127.0.0.1 -uroot -paccounts-local-test ping --silent >/dev/null 2>&1; then ready=1; break; fi
          if [ "$(docker inspect --format '{{"{{.State.Running}}"}}' "$accounts_container")" = false ]; then break; fi
          sleep 1
        done
        if [ "$ready" != 1 ]; then docker logs "$accounts_container"; exit 1; fi
        accounts_address=$(docker port "$accounts_container" 3306/tcp)
        export MYSQL_TEST_DSN="root:accounts-local-test@tcp($accounts_address)/isuride?parseTime=true&multiStatements=true"
        go test -race -count=1 -v -run '^Test(RuntimeAccountsSQLCollationAndSeedReload|ConcurrentInvitationsAndCouponConsumption|NewRideAndCouponWithWALCompletion|SalesSQLAndWALRecovery|NearbyWhileEvaluationResponseIsBlocked)$' .

  check-chair-distance:
    desc: ローカルの一時MySQLでSQL照合・WAL復元・通知・距離集計・初期化の統合テストだけをrace検査
    dir: '{{.APP_DIR}}'
    cmds:
      - |
        set -eu
        distance_container=$(docker run --rm -d --tmpfs /var/lib/mysql:rw,size=512m -p 127.0.0.1::3306 -e MYSQL_ROOT_PASSWORD=distance-local-test -e MYSQL_DATABASE=isuride mysql:8.0.46 --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci)
        trap 'docker rm -f "$distance_container" >/dev/null' EXIT
        ready=0
        for attempt in $(seq 1 60); do
          if docker exec "$distance_container" mysqladmin --host=127.0.0.1 -uroot -pdistance-local-test ping --silent >/dev/null 2>&1; then ready=1; break; fi
          if [ -z "$(docker ps -q --filter id="$distance_container")" ]; then break; fi
          sleep 1
        done
        if [ "$ready" != 1 ]; then docker logs "$distance_container"; exit 1; fi
        distance_address=$(docker port "$distance_container" 3306/tcp)
        export ISUCON_DB_HOST=127.0.0.1 ISUCON_DB_PORT="${distance_address##*:}"
        export ISUCON_DB_USER=root ISUCON_DB_PASSWORD=distance-local-test ISUCON_DB_NAME=isuride
        export CHAIR_DISTANCE_TEST_DSN="root:distance-local-test@tcp(127.0.0.1:$ISUCON_DB_PORT)/isuride?parseTime=true&multiStatements=true"
        export MYSQL_TEST_DSN="$CHAIR_DISTANCE_TEST_DSN"
        ../sql/init.sh
        go test -race -count=1 -v -run '^Test(ChairDistance|NearbyWhileEvaluationResponseIsBlocked|ConcurrentInvitationsAndCouponConsumption|NotificationsHistoryAndStats|NotificationsFailedWrite|NotificationStreamWakeup|ChairStatsCompletionAndWALRecovery|RuntimeAccountsSQLCollationAndSeedReload|SalesSQLAndWALRecovery|RuntimeRecoveryFromWAL|NewRideAndCouponWithWALCompletion)$' .

  deploy-sql:
    desc: SQL初期化資材をAPP_HOSTSとMYSQL_HOSTSへ反映（DB再作成・サービス再起動なし）
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists; run task after-bench or task abort-run
    deps: [build-deployctl]
    cmds:
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply sql-assets -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  prepare-db-assets:
    desc: deployへ載せる前にDB資材を生成・検証する（deploy系のhook、既定は何もしない）

  gen-contest-routing:
    desc: TaskfileのDB・solver配置とTLS分散配置から配布資材を生成
    preconditions:
      - sh: test '{{len (splitList " " .SOLVER_HOSTS)}}' = 1 -a '{{len (splitList " " .APP_HOSTS)}}' = 1
        msg: matching RPC requires one application owner and one solver host
    cmds:
      - mkdir -p tools/contest/generated
      - |
        cat > tools/contest/generated/database.env <<'EOF'
        # GENERATED by 'task gen' -- do not edit
        ISUCON_DB_HOST={{.MYSQL_IP}}
        ISUCON_DB_PORT=3306
        ISUCON_DB_NAME={{.DB_NAME}}
        EOF
      - |
        cat > tools/contest/generated/matching.env <<'EOF'
        # GENERATED by 'task gen' -- do not edit
        ISURIDE_SOLVER_URL=http://{{index .IP (splitList " " .SOLVER_HOSTS | first)}}:{{.SOLVER_PORT}}/solve
        EOF
        cat > tools/contest/generated/matching-worker.env <<'EOF'
        # GENERATED by 'task gen' -- do not edit
        ISURIDE_SOLVER_LISTEN={{index .IP (splitList " " .SOLVER_HOSTS | first)}}:{{.SOLVER_PORT}}
        ISURIDE_SOLVER_ALLOWED_IP={{index .IP (splitList " " .APP_HOSTS | first)}}
        EOF
      - >-
        python3 tools/contest/gen-tls-routing.py
        --hosts {{range (splitList " " .NGINX_HOSTS)}}{{.}}={{index $.IP .}} {{end}}
        --matcher-hosts {{.MATCHER_HOSTS}} --entry {{.ENTRY_HOST}}
        --forward-hosts {{.TLS_FORWARD_HOSTS}}
        --entry-ip {{.ENTRY_IP}} --port {{.TLS_BACKEND_PORT}}
        --interface {{.TLS_ENTRY_INTERFACE}} --remote-home {{.REMOTE_HOME}}

  check-contest-network:
    desc: TLS内部ポート・証明書・両終端と外部入口の内部API制限を読み取り確認
    cmds:
      - >-
        {{.SSH}} {{.SSH_USER}}@{{.ENTRY_HOST}}
        'set -eu;
        test "$(cat /proc/sys/net/ipv4/ip_forward)" = 1;
        sudo nft list table ip isuride_tls >/dev/null;
        systemctl is-enabled --quiet isuride-tls-forward;
        systemctl is-active --quiet isuride-tls-forward;
        ! systemctl is-active --quiet isuride-tls-router'
      - for: { var: NGINX_HOSTS }
        cmd: >-
          {{.SSH}} {{.SSH_USER}}@{{.ENTRY_HOST}}
          'set -eu;
          curl -fsS --connect-to isuride.xiv.isucon.net:443:{{index .IP .ITEM}}:{{.TLS_BACKEND_PORT}} -o /dev/null https://isuride.xiv.isucon.net/;
          code=$(curl -sS --connect-to isuride.xiv.isucon.net:443:{{index .IP .ITEM}}:{{.TLS_BACKEND_PORT}} -o /dev/null -w "%{http_code}" https://isuride.xiv.isucon.net/api/internal/_network-check);
          test "$code" = 403'
      - for: { var: MATCHER_HOSTS }
        cmd: >-
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}}
          'set -eu;
          curl -fsS --resolve isuride.xiv.isucon.net:443:127.0.0.1 -o /dev/null https://isuride.xiv.isucon.net/;
          code=$(curl -sS --resolve isuride.xiv.isucon.net:443:127.0.0.1 -o /dev/null -w "%{http_code}" https://isuride.xiv.isucon.net/api/internal/_network-check);
          test "$code" = 404'
      - for: { var: APP_HOSTS }
        cmd: >-
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}}
          'set -eu;
          timeout 2 bash -c "</dev/tcp/127.0.0.1/12345";
          code=$(curl -sS --resolve isuride.xiv.isucon.net:443:{{.ENTRY_IP}} -o /dev/null -w "%{http_code}" https://isuride.xiv.isucon.net/api/internal/_network-check);
          test "$code" = 403'

  apply-roles-dry:
    desc: 3台のサービスenable/disable計画を実行せず表示
    deps: [build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply-plan roles -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  setup-contest-assets:
    desc: 標準の取得対象外にある競技固有の資材を取得する（setupのhook、既定は何もしない）
    cmds:
      - '{{.RSYNC}} {{.SSH_USER}}@{{splitList " " .MATCHER_HOSTS | first}}:/etc/systemd/system/isuride-matcher.service etc/systemd/system/'
      - '{{.RSYNC}} {{.SSH_USER}}@{{splitList " " .PAYMENT_MOCK_HOSTS | first}}:/etc/systemd/system/isuride-payment_mock.service etc/systemd/system/'

  setup-smoke-probes:
    desc: smoke実行中に競技固有の経路を追加で確認する（setup-smokeのhook、既定は何もしない）
    cmds:
      - '{{.SSH}} {{.SSH_USER}}@{{.MYSQL_HOST}} "sudo mysql {{.DB_NAME}} -e \"SELECT SLEEP(0.06) AS setup_slow_log_probe\""'

  setup-smoke-analysis:
    desc: RUNを作らず疎通成果物をDuckDBとdashboardのAPI・parserで確認
    requires:
      vars: [SMOKE_DIR]
    env:
      ISUCON_SETUP_SMOKE_DIR: '{{.ROOT_DIR}}/{{.SMOKE_DIR}}'
    cmds:
      - cd tools/analysisctl && go test -count=1 -v -run '^TestISURIDE(SetupSmokeDuckDB|PortalResultMarkers)$' .
      - cd tools/analysisctl/internal/pprofimport && go test -count=1 -v -run '^TestISURIDESetupSmokePprofDuckDB$' .
      - cd tools/dashboard/server && go test -count=1 -v -run '^TestISURIDESetupSmokeAPI$' .
      - for profile in '{{.SMOKE_DIR}}'/*.pprof; do go tool pprof -top "$profile"; done

  setup-postflight:
    desc: 配布物・role・内部疎通とcollector終了を読み取りで確認
    deps: [build-deployctl, build-measurectl]
    cmds:
      - task: check-roles
      - task: check-network
      - '{{.DEPLOYCTL_DIR}}/deployctl verify -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'
      - '{{.MEASURECTL_DIR}}/measurectl collect check-clean {{.MEASURECTL_REMOTE}}'
      - for: { var: APP_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "curl -fsS http://127.0.0.1:6060/debug/profiles/status" </dev/null'
