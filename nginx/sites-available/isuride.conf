server {
  listen 80 default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;
  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  include /etc/nginx/tls-listen-default.conf;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;

  # The default vhost uses the official self-signed certificate.
  ssl_certificate     /etc/nginx/tls/dummy.crt;
  ssl_certificate_key /etc/nginx/tls/dummy.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  include /etc/nginx/tls-listen.conf;
  server_name xiv.isucon.net;
  server_name *.xiv.isucon.net;

  ssl_certificate     /etc/nginx/tls/_.xiv.isucon.net.crt;
  ssl_certificate_key /etc/nginx/tls/_.xiv.isucon.net.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 10m;
  root /home/isucon/webapp/public/;
  # Only content-hashed build assets are immutable; missing files must not serve HTML.
  location ~ "^/assets/[A-Za-z0-9_.-]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # Fixed-name images may change between deployments; cache them for five minutes.
  location ~ "^/(images/[^/]+\.(svg|png)|favicon\.ico|favicon-(32x32|128x128)\.png|apple-touch-icon-180x180\.png)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }
  # The static SPA entry also handles internal redirects from the fallback below.
  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=60";
  }
  location / {
    try_files $uri /index.html;
  }
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_hide_header X-Measurement-Session-ID;
    proxy_pass http://app;
  }

  location /api/internal/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Routed TLS listeners must never expose internal APIs, even on loopback.
    if ($server_port != 443) { return 403; }
    # Only the matcher's direct loopback TLS listener may reach Go.
    allow 127.0.0.1;
    deny all;
    proxy_set_header Host $host;
    proxy_hide_header X-Measurement-Session-ID;
    proxy_pass http://app;
  }
}
